[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcert"
version = "0.1.0"
description = "Five-moment target-certified polynomial iteration"
requires-python = ">=3.10"
dependencies = [
  "cvxpy>=1.6,<2",
  "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
